name: Tests et images Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.9'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  images:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Construire les deux images
        run: docker compose build --pull
      - name: Vérifier les conteneurs ensemble
        run: scripts/smoke-containers.sh
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags de l’image backend
        if: github.event_name == 'push'
        id: backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/gaspardmenou/doom-web-backend
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Tags de l’image frontend
        if: github.event_name == 'push'
        id: frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/gaspardmenou/doom-web-frontend
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Publier les images vérifiées
        if: github.event_name == 'push'
        env:
          BACKEND_TAGS: ${{ steps.backend.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag ghcr.io/gaspardmenou/doom-web-backend:ci "$tag"
            docker push "$tag"
          done <<< "$BACKEND_TAGS"
          while IFS= read -r tag; do
            docker tag ghcr.io/gaspardmenou/doom-web-frontend:ci "$tag"
            docker push "$tag"
          done <<< "$FRONTEND_TAGS"
